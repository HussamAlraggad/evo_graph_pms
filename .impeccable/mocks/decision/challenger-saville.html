<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Factory Catalog Sleeve — sketch</title>
<style>
  :root{--bg:#0b0b0b;--ink:#f2f2f2;--dim:#6b6b6b;--rule:#242424;--blue:#2a52be;--yellow:#e8c531;--red:#c8102e;--gray:#8a8a8a}
  *{box-sizing:border-box}
  body{margin:0;width:420px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue",system-ui,sans-serif}
  .panel{position:relative;width:420px;height:900px;padding:0 20px}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 12px;border-bottom:1px solid var(--rule)}
  header h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.3em}
  header .r{font-size:9px;letter-spacing:.22em;color:var(--dim)}
  .plot{display:block;width:380px;height:170px;margin:18px 0 8px}
  .entry{display:grid;grid-template-columns:1fr auto;gap:16px;padding:13px 0 12px;border-bottom:1px solid var(--rule)}
  .entry .fac{font-size:23px;font-weight:300;letter-spacing:.06em;margin:0 0 4px}
  .entry h2{margin:0 0 7px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#d8d8d8}
  .strip{display:flex;gap:3px}
  .strip i{width:15px;height:8px;background:#2c2c2c;display:inline-block}
  .meta{text-align:right;font-size:10px;letter-spacing:.14em;color:var(--dim);padding-top:4px}
  .meta .state{margin-top:6px;color:var(--yellow);font-size:9px;letter-spacing:.2em}
  .entry.active{background:var(--ink);color:#0b0b0b;border-left:5px solid var(--red);padding-left:12px;margin-left:-20px;padding-right:20px}
  .entry.active h2{color:#0b0b0b}
  .entry.active .meta{color:#5a5a5a}
  .entry.active .meta .state{color:var(--red)}
  footer{position:absolute;left:20px;right:20px;bottom:22px;padding-top:10px;border-top:1px solid var(--rule);
    display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
</style>
</head>
<body>
<div class="panel">
  <header><h1>EVOGRAPH</h1><span class="r">FAC SHEET 102</span></header>

  <svg class="plot" viewBox="0 0 380 170" aria-hidden="true">
    <polyline points="20,140 80,140 100,120 170,120 190,80 260,80 280,50 360,50" fill="none" stroke="#f2f2f2" stroke-width="1.3"/>
    <polyline points="280,50 360,50" fill="none" stroke="#c8102e" stroke-width="1.8"/>
    <circle cx="20" cy="140" r="3" fill="#f2f2f2"/><circle cx="100" cy="120" r="3" fill="#f2f2f2"/>
    <circle cx="190" cy="80" r="3" fill="#f2f2f2"/><circle cx="280" cy="50" r="3" fill="#f2f2f2"/>
    <circle cx="360" cy="50" r="3.5" fill="#c8102e"/>
    <line x1="20" y1="160" x2="360" y2="160" stroke="#242424" stroke-width="1"/>
  </svg>

  <div class="entry">
    <div><p class="fac">FAC 0A41</p><h2>Origin</h2>
      <div class="strip"><i style="background:var(--gray)"></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="meta">09:12<div class="state">ORIGIN</div></div>
  </div>

  <div class="entry">
    <div><p class="fac">FAC 3F8E</p><h2>Changed README.md</h2>
      <div class="strip"><i></i><i style="background:var(--red)"></i><i></i><i></i><i></i></div>
    </div>
    <div class="meta">09:48<div class="state">MANUAL</div></div>
  </div>

  <div class="entry">
    <div><p class="fac">FAC 77C1</p><h2>Changed 4 files</h2>
      <div class="strip"><i></i><i style="background:var(--red)"></i><i></i><i></i><i></i></div>
    </div>
    <div class="meta">10:31<div class="state">MANUAL</div></div>
  </div>

  <div class="entry">
    <div><p class="fac">FAC 91B4</p><h2>Changed auth-flow.ts</h2>
      <div class="strip"><i></i><i style="background:var(--red)"></i><i></i><i></i><i></i></div>
    </div>
    <div class="meta">10:58<div class="state">MANUAL</div></div>
  </div>

  <div class="entry active">
    <div><p class="fac">FAC B2F7</p><h2>Changed login.ts</h2>
      <div class="strip"><i></i><i style="background:var(--red)"></i><i></i><i></i><i></i></div>
    </div>
    <div class="meta">11:02<div class="state">ACTIVE</div></div>
  </div>

  <footer><span>One plot owns the field</span><span>6 entries</span></footer>
</div>
</body>
</html>
